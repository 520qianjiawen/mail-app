<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Mail Lite</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <div class="brand"><img src="logo.png" alt=""><span>Mail Lite</span></div>
    <div class="navigation" role="group" aria-label="邮件页面导航">
      <button id="back" class="icon-button" title="返回" aria-label="返回" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
      <button id="forward" class="icon-button" title="前进" aria-label="前进" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
      <button id="reload" class="icon-button" title="刷新当前页面 ⌘R" aria-label="刷新当前页面" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2.3 5.6M20 7l-2.3-2"/></svg></button>
      <button id="home" class="icon-button" title="返回邮箱首页 ⌘1" aria-label="返回邮箱首页" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-7h6v7"/></svg></button>
    </div>
    <button id="all-inboxes" class="inboxes-button" title="所有收件箱 ⌘⇧I" hidden>所有收件箱</button>
    <span id="host" class="host">你的邮件，独立一窗。</span>
    <label id="region-control" class="region-control"><span class="sr-only">邮箱地区</span><select id="region" aria-label="邮箱地区"></select><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></label>
    <div id="account-control" class="account-control" hidden>
      <label class="region-control"><span class="sr-only">切换账号</span><select id="accounts" aria-label="切换账号"></select><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></label>
      <button id="add-account" class="icon-button" title="添加账号" aria-label="添加账号"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div id="progress" class="progress" hidden></div>
  </header>
  <main id="welcome" class="center-stage">
    <div class="welcome-content">
      <img class="mail-symbol" src="logo.png" alt="Mail Lite">
      <p class="eyebrow">A LITTLE SPACE FOR YOUR MAIL</p>
      <h1>专心，处理邮件。</h1>
      <p class="description">收件、回复、发送。<br>把你的 Zoho 邮箱，放进一个安静的独立窗口。</p>
      <button id="connect" class="primary-button">打开 Zoho 邮箱 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button>
      <p id="welcome-hint" class="hint">先在右上角选择邮箱地区，然后使用 Zoho 账号登录。</p>
      <div class="privacy-note"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="8" width="10" height="8" rx="2"/><path d="M7 8V6a3 3 0 0 1 6 0v2"/></svg><span>在 Zoho 页面登录 · 登录状态仅保存在这台电脑</span></div>
    </div>
    <div class="edition">MAIL LITE <span>01 / 邮件</span></div>
  </main>
  <main id="loading" class="center-stage" hidden><div class="state-content"><span class="spinner" aria-hidden="true"></span><h2>正在连接邮箱</h2><p>首次连接可能需要一点时间。</p></div></main>
  <main id="error" class="center-stage" hidden><div class="state-content"><div class="error-symbol" aria-hidden="true">↻</div><h2>暂时连不上邮箱</h2><p id="error-message"></p><button id="retry" class="primary-button">重新连接</button></div></main>
  <main id="inboxes" class="inboxes-stage" aria-labelledby="inboxes-title" hidden>
    <div class="inboxes-heading"><div><h1 id="inboxes-title">所有收件箱</h1><p id="inboxes-summary" aria-live="polite"></p></div><span id="inboxes-updated"></span></div>
    <div id="inboxes-errors" class="inboxes-errors" aria-live="polite"></div>
    <div id="inboxes-list" class="inboxes-list" aria-label="所有账号的收件邮件"></div>
    <div id="inboxes-empty" class="inboxes-empty" role="status"><span id="inboxes-spinner" class="spinner" hidden></span><h2 id="inboxes-empty-title">正在读取收件箱</h2><p id="inboxes-empty-description"></p></div>
    <div class="inboxes-bottom"><button id="inboxes-more" class="secondary-button" hidden>加载更多</button></div>
  </main>
  <dialog id="account-dialog" aria-labelledby="account-dialog-title">
    <form id="account-form">
      <div class="dialog-heading"><img src="logo.png" alt=""><div><h2 id="account-dialog-title">添加账号</h2><p id="account-dialog-description">每个账号独立登录，可随时切换。</p></div></div>
      <label class="form-field">账号名称或邮箱<input id="account-name" name="accountName" maxlength="80" placeholder="例如：工作邮箱 / me@example.com" autocomplete="off"></label>
      <label id="account-region-field" class="form-field">邮箱地区<select id="account-region" name="accountRegion"></select></label>
      <p id="account-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button id="account-cancel" type="button" class="secondary-button">取消</button><button id="account-submit" type="submit" class="primary-button">添加并登录</button></div>
    </form>
  </dialog>
  <footer class="statusbar"><span id="status" role="status" aria-live="polite">准备就绪</span><span>邮件专用 <span class="dot">·</span> <span id="version"></span></span></footer>
</body>
</html>
